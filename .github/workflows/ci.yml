name: CI
on:
  push: { branches: [ main ] }
  pull_request:
jobs:
  lint-links-spell-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Agent Skills validator
        run: python -m pip install skills-ref==0.1.1
      - name: Generated artifact drift
        run: |
          npm run generate:vpp
          npm run build:skill-script
          npm run package:plugin
          git diff --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: VPP runtime and MCP contracts
        run: npm run test:vpp
      - name: Skill and plugin artifacts
        run: npm run validate:vpp-artifacts
      - name: OpenAI public plugin submission packet
        run: npm run validate:openai-submission
      - name: Downloadable plugin and skill bundles
        run: npm run check:plugin-package
      - name: Open Agent Skills validation
        run: agentskills validate plugins/viable-prompt-protocol/skills/viable-prompt-protocol
      - name: Markdownlint
        run: npm run lint:md
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --max-concurrency 4 --accept 200,206 --exclude-mail --timeout 20s "**/*.md"
      - name: Spellcheck
        run: npm run lint:spell
      - name: Parser tests
        run: npm run test:parser
      - name: Corpus validation
        run: npm run validate
      - name: Documentation build
        run: npm run docs:build
      - name: Cloudflare Worker dry run
        run: npm run build:worker
      - name: Local Cloudflare Worker smoke test
        run: npm run test:worker-local
